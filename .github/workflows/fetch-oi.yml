name: Fetch Daily OI

on:
  schedule:
    # Roda 00:30 UTC = 18:30 CT (CME publica OI preliminar ~18:00 CT)
    # E 13:00 UTC = 07:00 CT (atualiza antes do mercado abrir)
    - cron: '30 0 * * 1-6'   # Ter-Sab (dados de Seg-Sex)
    - cron: '0 13 * * 1-5'   # Seg-Sex manhã
  workflow_dispatch:           # Permite rodar manualmente

jobs:
  fetch-oi:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch OI and save to JSONBin
        env:
          JSONBIN_KEY: ${{ secrets.JSONBIN_KEY }}
          JSONBIN_ID: ${{ secrets.JSONBIN_ID }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          JSONBIN_KEY = os.environ.get("JSONBIN_KEY", "")
          JSONBIN_ID = os.environ.get("JSONBIN_ID", "")

          if not JSONBIN_KEY or not JSONBIN_ID:
              print("ERRO: JSONBIN_KEY e JSONBIN_ID devem estar configurados como secrets")
              sys.exit(1)

          def fetch_yahoo_oi():
              """Busca OI via Yahoo Finance v8 Chart API."""
              for symbol in ["NQ%3DF", "MNQ%3DF"]:
                  try:
                      url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range=5d&interval=1d&includePrePost=false"
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                      })
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          data = json.loads(resp.read())

                      result = data.get("chart", {}).get("result", [{}])[0]
                      meta = result.get("meta", {})
                      oi = int(meta.get("openInterest", 0) or 0)

                      if oi > 10000:
                          sym_clean = symbol.replace("%3D", "=")
                          print(f"Yahoo Chart ({sym_clean}): OI = {oi:,}")
                          return {"oi": oi, "source": f"Yahoo-{sym_clean}"}

                      # Tentar no quote endpoint também
                      quote_url = f"https://query1.finance.yahoo.com/v7/finance/quote?symbols={symbol}"
                      req2 = urllib.request.Request(quote_url, headers={
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                      })
                      with urllib.request.urlopen(req2, timeout=15) as resp2:
                          qdata = json.loads(resp2.read())

                      quotes = qdata.get("quoteResponse", {}).get("result", [])
                      if quotes:
                          q = quotes[0]
                          oi_q = int(q.get("openInterest", 0) or 0)
                          if oi_q > 10000:
                              sym_clean = symbol.replace("%3D", "=")
                              print(f"Yahoo Quote ({sym_clean}): OI = {oi_q:,}")
                              return {"oi": oi_q, "source": f"Yahoo-{sym_clean}"}

                  except Exception as e:
                      print(f"Yahoo {symbol}: {e}")
              return None

          def fetch_cme_oi():
              """Busca OI via CME settlements API."""
              urls = [
                  "https://www.cmegroup.com/CmeWS/mvc/Settlements/Futures/Settlements/NQ/FUT?strategy=DEFAULT&tradeDate=",
                  "https://www.cmegroup.com/CmeWS/mvc/Volume/Details/F/NQ/FUT",
              ]
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={
                          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                          "Accept": "application/json",
                          "Referer": "https://www.cmegroup.com/",
                      })
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          data = json.loads(resp.read())

                      if isinstance(data, dict) and "settlements" in data:
                          for s in data["settlements"][:5]:
                              try:
                                  oi_str = str(s.get("openInterest", "0")).replace(",", "").replace("+", "").replace("-", "").strip() or "0"
                                  oi_val = int(oi_str)
                                  if oi_val > 10000:
                                      print(f"CME Settlements: OI = {oi_val:,}")
                                      return {"oi": oi_val, "source": "CME"}
                              except (ValueError, TypeError):
                                  continue

                      if isinstance(data, dict) and "totals" in data:
                          try:
                              oi_val = int(str(data["totals"].get("openInterest", "0")).replace(",", ""))
                              if oi_val > 10000:
                                  print(f"CME Volume: OI = {oi_val:,}")
                                  return {"oi": oi_val, "source": "CME"}
                          except (ValueError, TypeError):
                              pass
                  except Exception as e:
                      print(f"CME {url[:60]}: {e}")
              return None

          def fetch_barchart_oi():
              """Scrape OI do Barchart."""
              import re
              try:
                  url = "https://www.barchart.com/futures/quotes/NQ*0/overview"
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml",
                  })
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      html = resp.read().decode("utf-8", errors="ignore")

                  if "openinterest" in html.lower() or "open interest" in html.lower():
                      matches = re.findall(r'(?:open.?interest|oi)["\s:]+([0-9,]+)', html, re.IGNORECASE)
                      for m in matches:
                          try:
                              oi_val = int(m.replace(",", ""))
                              if oi_val > 10000:
                                  print(f"Barchart: OI = {oi_val:,}")
                                  return {"oi": oi_val, "source": "Barchart"}
                          except ValueError:
                              continue
              except Exception as e:
                  print(f"Barchart: {e}")
              return None

          # ── Executar cascata de fontes ──
          print(f"=== Fetch OI — {datetime.now(timezone.utc).isoformat()} ===")

          result = None
          for name, fn in [("Yahoo", fetch_yahoo_oi), ("CME", fetch_cme_oi), ("Barchart", fetch_barchart_oi)]:
              print(f"Tentando {name}...")
              result = fn()
              if result:
                  break
              print(f"  {name}: sem dados")

          if not result:
              print("NENHUMA fonte retornou OI. Abortando.")
              sys.exit(0)  # Não falha o workflow — só não atualiza

          # ── Ler JSONBin atual ──
          print(f"\nOI encontrado: {result['oi']:,} ({result['source']})")
          print("Lendo JSONBin atual...")

          try:
              read_url = f"https://api.jsonbin.io/v3/b/{JSONBIN_ID}/latest"
              req = urllib.request.Request(read_url, headers={
                  "X-Master-Key": JSONBIN_KEY,
                  "X-Bin-Meta": "false",
              })
              with urllib.request.urlopen(req, timeout=10) as resp:
                  current = json.loads(resp.read())
          except Exception as e:
              print(f"Erro ao ler JSONBin: {e}")
              current = {}

          # ── Atualizar campo daily_oi ──
          now_str = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          prev_daily = current.get("daily_oi", {})
          prev_oi_val = prev_daily.get("oi", 0)

          current["daily_oi"] = {
              "oi": result["oi"],
              "prev_oi": prev_oi_val if prev_oi_val > 0 else result["oi"],
              "source": result["source"],
              "updated_at": now_str,
          }

          # ── Salvar no JSONBin ──
          print(f"Salvando no JSONBin... (OI={result['oi']:,}, prev={prev_oi_val:,})")
          try:
              write_url = f"https://api.jsonbin.io/v3/b/{JSONBIN_ID}"
              payload = json.dumps(current).encode("utf-8")
              req = urllib.request.Request(write_url, data=payload, method="PUT", headers={
                  "X-Master-Key": JSONBIN_KEY,
                  "Content-Type": "application/json",
              })
              with urllib.request.urlopen(req, timeout=10) as resp:
                  resp.read()
              print("JSONBin atualizado com sucesso!")
          except Exception as e:
              print(f"Erro ao salvar JSONBin: {e}")
              sys.exit(1)

          PYEOF
